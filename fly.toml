# Fly.io 部署配置(WebSocket 友好)
# 部署步骤见对话中的分步指南。
# 应用名 glorr-server → 公网地址 https://glorr-server.fly.dev
# 若改了 app 名,记得同步改 src/shared/servers.ts 里的 SERVER_ORIGIN。
app = "glorr-server"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # 保持常驻,不休眠(免费额度内),避免玩家进入时等待冷启动
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
